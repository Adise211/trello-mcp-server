<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      name="stytch-token"
      content="<%= process.env.STYTCH_PUBLIC_TOKEN %>"
    />
    <script type="importmap">
      {
        "imports": {
          "@stytch/vanilla-js": "https://www.unpkg.com/@stytch/vanilla-js@5.32/dist/index.esm.js"
        }
      }
    </script>
    <title>Document</title>
  </head>
  <body>
    <div id="stytch-sdk-logout">
      <div id="logout-loader">Signing out...</div>
    </div>
    <script type="module">
      import { StytchUIClient } from "@stytch/vanilla-js";

      // Get the Stytch token from the meta tag
      const getStytchToken = () => {
        const metaToken = document.querySelector('meta[name="stytch-token"]');
        if (metaToken) {
          return metaToken.getAttribute("content") || "";
        }
        throw new Error("Stytch public token not found");
      };

      const stytch = new StytchUIClient(getStytchToken());

      // Logout the user
      const logout = () => {
        const loader = document.getElementById("logout-loader");
        if (loader) {
          loader.innerText = "Signing out...";
        }
        stytch.session
          .revoke()
          .then(() => {
            window.location.href = "/login";
          })
          .catch((error) => {
            console.error("Error logging out:", error);
            if (loader) {
              loader.innerText = "Error signing out";
            }
            window.location.href = "/login";
          })
          .finally(() => {
            if (loader) {
              loader.innerText = "Signed out";
            }
          });
      };

      logout();
    </script>
  </body>
</html>
